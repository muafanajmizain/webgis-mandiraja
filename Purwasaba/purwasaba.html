      @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap");

      * {
        font-family: "Plus Jakarta Sans", sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      /* Map Section Styling */
      .map-page {
        padding-top: 80px;
        padding-bottom: 0;
        padding-left: 20px;
        padding-right: 20px;
        margin: 0;
      }

      .map-container {
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        border-radius: 24px;
        padding: 10px;
        box-shadow: 0 10px 40px rgba(255, 105, 180, 0.15);
        border: 1px solid rgba(255, 182, 193, 0.3);
        margin-bottom: 0;
        margin-top: 15px;
      }

      #map {
        width: 100%;
        height: calc(100vh - 100px);
        min-height: 550px;
        border-radius: 16px;
        overflow: hidden;
        z-index: 10;
      }

      /* Responsive — Mobile */
      @media (max-width: 768px) {
        .map-page {
          padding: 60px 10px 0 10px;
        }

        .map-container {
          padding: 8px;
          border-radius: 16px;
          margin-top: -5px;
        }

        #map {
          height: calc(100vh - 90px);
          min-height: 480px;
          border-radius: 12px;
        }
      }

      /* Navbar Effects */
      .navbar-container {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .navbar-container.scrolled .glassmorphism {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(255, 105, 180, 0.15);
      }

      .navbar-container:not(.scrolled) .glassmorphism {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(255, 105, 180, 0.15);
      }

      .glassmorphism {
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.4s ease;
      }

      .nav-link {
        position: relative;
        transition: all 0.3s ease;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        width: 0;
        height: 3px;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #111111, #111111);
        transition: width 0.3s ease;
        border-radius: 2px;
      }

      .nav-link:hover::after,
      .nav-link.active::after {
        width: 100%;
      }

      /* Rotate arrow animation */
      .rotate-180 {
        transform: rotate(180deg);
        transition: transform 0.3s ease;
      }

      /* Dropdown z-index fix */
      #dropdown-menu {
        z-index: 60 !important;
      }

      #mobile-dropdown-menu {
        z-index: 60 !important;
      }

      /* Dropdown item hover & active state */
      .dropdown-item {
        transition: background-color 0.2s ease;
      }

      .dropdown-item.active-page {
        background-color: rgb(254 242 242);
        font-weight: 600;
      }
    </style>

    <!-- JavaScript for Navbar -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const navbar = document.querySelector(".navbar-container");
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        const hamburgerIcon = document.getElementById("hamburger-icon");
        const closeIcon = document.getElementById("close-icon");

        // Scroll effect
        window.addEventListener("scroll", () => {
          if (window.scrollY > 50) {
            navbar.classList.add("scrolled");
          } else {
            navbar.classList.remove("scrolled");
          }
        });

        // Mobile menu toggle
        mobileMenuBtn.addEventListener("click", () => {
          mobileMenu.classList.toggle("hidden");
          hamburgerIcon.classList.toggle("hidden");
          closeIcon.classList.toggle("hidden");
        });

        // ✅ Deteksi halaman aktif dan tambahkan highlight
        const currentPage =
          window.location.pathname.split("/").pop() || "index.html";

        // Hapus semua active-page terlebih dahulu
        document.querySelectorAll(".dropdown-item").forEach((item) => {
          item.classList.remove("active-page");
        });

        // Tambahkan active-page pada item yang sesuai
        document.querySelectorAll(".dropdown-item").forEach((item) => {
          const page = item.getAttribute("data-page");
          if (currentPage.includes(page)) {
            item.classList.add("active-page");
          }
        });

        // Active link logic untuk nav-link utama
        document.querySelectorAll(".nav-link").forEach((link) => {
          link.classList.remove("active");
        });

        document.querySelectorAll(".nav-link").forEach((link) => {
          const href = link.getAttribute("href");
          if (!href) return;

          const normHref = href.split("#")[0].split("?")[0];
          const normCurrent = currentPage.split("#")[0].split("?")[0];

          if (
            normCurrent === "panggisari.html" &&
            (normHref === "panggisari.html" ||
              normHref.includes("/panggisari.html"))
          ) {
            link.classList.add("active");
          } else if (
            ["beranda.html", "index.html", ""].includes(normCurrent) &&
            normHref === "../beranda.html"
          ) {
            link.classList.add("active");
          } else if (
            normHref === "../tentang.html" &&
            normCurrent === "tentang.html"
          ) {
            link.classList.add("active");
          } else if (
            normHref === "../mandiraja/mandiraja.html" &&
            normCurrent === "mandiraja.html"
          ) {
            link.classList.add("active");
          }
        });

        // ✅ Desktop Dropdown - Hover untuk buka/tutup
        const dropdownContainer = document.querySelector(".dropdown-container");
        const dropdownBtn = document.getElementById("dropdown-btn");
        const dropdownMenu = document.getElementById("dropdown-menu");
        const dropdownArrow = dropdownBtn?.querySelector("svg");

        if (dropdownContainer && dropdownMenu && dropdownArrow) {
          // Buka dropdown saat hover
          dropdownContainer.addEventListener("mouseenter", () => {
            dropdownMenu.classList.remove("hidden");
            dropdownArrow.classList.add("rotate-180");
          });

          // Tutup dropdown saat cursor keluar
          dropdownContainer.addEventListener("mouseleave", () => {
            dropdownMenu.classList.add("hidden");
            dropdownArrow.classList.remove("rotate-180");
          });

          // Tetap bisa diklik untuk toggle (opsional)
          dropdownBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle("hidden");
            dropdownArrow.classList.toggle("rotate-180");
          });
        }

        // Mobile Dropdown
        const mobileDropdownBtn = document.getElementById(
          "mobile-dropdown-btn"
        );
        const mobileDropdownMenu = document.getElementById(
          "mobile-dropdown-menu"
        );
        const mobileDropdownArrow = document.getElementById(
          "mobile-dropdown-arrow"
        );

        if (mobileDropdownBtn && mobileDropdownMenu && mobileDropdownArrow) {
          mobileDropdownBtn.addEventListener("click", () => {
            mobileDropdownMenu.classList.toggle("hidden");
            mobileDropdownArrow.classList.toggle("rotate-180");
          });
        }
      });
    </script>
