      * {

        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,

        margin: 0;
        padding: 0;
        height: 100%;

      /* Map Section Styling */
      .map-page {
        padding-top: 80px;
        padding-bottom: 0;
        padding-left: 20px;
        padding-right: 20px;
        margin: 0;
      }

      .map-container {
        max-width: 1400px;
        margin: 0 auto;
        background: white;
        border-radius: 24px;
        padding: 10px;
        box-shadow: 0 10px 40px rgba(255, 105, 180, 0.15);
        border: 1px solid rgba(255, 182, 193, 0.3);
        margin-bottom: 0;
        margin-top: 15px;
      }

      #map {
        width: 100%;
        height: calc(100vh - 100px);
        min-height: 550px;
        border-radius: 16px;
        overflow: hidden;
        z-index: 10;
      }

      /* Responsive — Mobile */
      @media (max-width: 768px) {
        .map-page {
          padding: 60px 10px 0 10px;
        }

        .map-container {
          padding: 8px;
          border-radius: 16px;
          margin-top: -5px;
        }

        #map {
          height: calc(100vh - 90px);
          min-height: 480px;
          border-radius: 12px;
        }
      }

      /* Navbar Effects */
      .navbar-container {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .navbar-container.scrolled .glassmorphism {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(255, 105, 180, 0.15);
      }

      .navbar-container:not(.scrolled) .glassmorphism {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(20px);
        box-shadow: 0 8px 32px rgba(255, 105, 180, 0.15);
      }

      .glassmorphism {
        border: 1px solid rgba(255, 255, 255, 0.3);
        transition: all 0.4s ease;
      }

      .nav-link {
        position: relative;
        transition: all 0.3s ease;
      }

      .nav-link::after {
        content: "";
        position: absolute;
        width: 0;
        height: 3px;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(90deg, #111111, #111111);
        transition: width 0.3s ease;
        border-radius: 2px;
      }

      .nav-link:hover::after,
      .nav-link.active::after {
        width: 100%;
      }

      /* Rotate arrow animation */
      .rotate-180 {
        transform: rotate(180deg);
        transition: transform 0.3s ease;
      }

      /* Dropdown z-index fix */
      #dropdown-menu {
        z-index: 60 !important;
      }

      #mobile-dropdown-menu {
        z-index: 60 !important;
      }

      /* Dropdown item hover & active state */
      .dropdown-item {
        transition: background-color 0.2s ease;
      }

      .dropdown-item.active-page {
        background-color: rgb(254 242 242);
        font-weight: 600;
      }
    </style>

    <!-- JavaScript for Navbar -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const navbar = document.querySelector(".navbar-container");
        const mobileMenuBtn = document.getElementById("mobile-menu-btn");
        const mobileMenu = document.getElementById("mobile-menu");
        const hamburgerIcon = document.getElementById("hamburger-icon");
        const closeIcon = document.getElementById("close-icon");

        // Scroll effect
        window.addEventListener("scroll", () => {
          if (window.scrollY > 50) {
            navbar.classList.add("scrolled");
          } else {
            navbar.classList.remove("scrolled");
          }
        });

        // Mobile menu toggle
        mobileMenuBtn.addEventListener("click", () => {
          mobileMenu.classList.toggle("hidden");
          hamburgerIcon.classList.toggle("hidden");
          closeIcon.classList.toggle("hidden");
        });

        // ✅ Deteksi halaman aktif dan tambahkan highlight
        const currentPage =
          window.location.pathname.split("/").pop() || "index.html";

        // Hapus semua active-page terlebih dahulu
        document.querySelectorAll(".dropdown-item").forEach((item) => {
          item.classList.remove("active-page");
        });

        // Tambahkan active-page pada item yang sesuai
        document.querySelectorAll(".dropdown-item").forEach((item) => {
          const page = item.getAttribute("data-page");
          if (currentPage.includes(page)) {
            item.classList.add("active-page");
          }
        });

        // Active link logic untuk nav-link utama
        document.querySelectorAll(".nav-link").forEach((link) => {
          link.classList.remove("active");
        });

        document.querySelectorAll(".nav-link").forEach((link) => {
          const href = link.getAttribute("href");
          if (!href) return;

          const normHref = href.split("#")[0].split("?")[0];
          const normCurrent = currentPage.split("#")[0].split("?")[0];

          if (
            normCurrent === "panggisari.html" &&
            (normHref === "panggisari.html" ||
              normHref.includes("/panggisari.html"))
          ) {
            link.classList.add("active");
          } else if (
            ["beranda.html", "index.html", ""].includes(normCurrent) &&
            normHref === "../beranda.html"
          ) {
            link.classList.add("active");
          } else if (
            normHref === "../tentang.html" &&
            normCurrent === "tentang.html"
          ) {
            link.classList.add("active");
          } else if (
            normHref === "../mandiraja/mandiraja.html" &&
            normCurrent === "mandiraja.html"
          ) {
            link.classList.add("active");
          }
        });

        // ✅ Desktop Dropdown - Hover untuk buka/tutup
        const dropdownContainer = document.querySelector(".dropdown-container");
        const dropdownBtn = document.getElementById("dropdown-btn");
        const dropdownMenu = document.getElementById("dropdown-menu");
        const dropdownArrow = dropdownBtn?.querySelector("svg");

        if (dropdownContainer && dropdownMenu && dropdownArrow) {
          // Buka dropdown saat hover
          dropdownContainer.addEventListener("mouseenter", () => {
            dropdownMenu.classList.remove("hidden");
            dropdownArrow.classList.add("rotate-180");
          });

          // Tutup dropdown saat cursor keluar
          dropdownContainer.addEventListener("mouseleave", () => {
            dropdownMenu.classList.add("hidden");
            dropdownArrow.classList.remove("rotate-180");
          });

          // Tetap bisa diklik untuk toggle (opsional)
          dropdownBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle("hidden");
            dropdownArrow.classList.toggle("rotate-180");
          });
        }

        // Mobile Dropdown
        const mobileDropdownBtn = document.getElementById(
          "mobile-dropdown-btn"
        );
        const mobileDropdownMenu = document.getElementById(
          "mobile-dropdown-menu"
        );
        const mobileDropdownArrow = document.getElementById(
          "mobile-dropdown-arrow"
        );

        if (mobileDropdownBtn && mobileDropdownMenu && mobileDropdownArrow) {
          mobileDropdownBtn.addEventListener("click", () => {
            mobileDropdownMenu.classList.toggle("hidden");
            mobileDropdownArrow.classList.toggle("rotate-180");
          });
        }
      });
    </script>

    <script>
      var map = L.map("map", {
        zoomControl: false,
        maxZoom: 28,
        minZoom: 1,
      }).fitBounds([
        [-7.466819339685051, 109.47826404077958],
        [-7.453386668617016, 109.50633022461196],
      ]);
      var hash = new L.Hash(map);
      map.attributionControl.setPrefix(
        '<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>'
      );
      var autolinker = new Autolinker({
        truncate: { length: 30, location: "smart" },
      });
      // remove popup's row if "visible-with-data"
      function removeEmptyRowsFromPopupContent(content, feature) {
        var tempDiv = document.createElement("div");
        tempDiv.innerHTML = content;
        var rows = tempDiv.querySelectorAll("tr");
        for (var i = 0; i < rows.length; i++) {
          var td = rows[i].querySelector("td.visible-with-data");
          var key = td ? td.id : "";
          if (
            td &&
            td.classList.contains("visible-with-data") &&
            feature.properties[key] == null
          ) {
            rows[i].parentNode.removeChild(rows[i]);
          }
        }
        return tempDiv.innerHTML;
      }
      // modify popup if contains media
      function addClassToPopupIfMedia(content, popup) {
        var tempDiv = document.createElement("div");
        tempDiv.innerHTML = content;
        var imgTd = tempDiv.querySelector("td img");
        if (imgTd) {
          var src = imgTd.getAttribute("src");
          if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
            popup._contentNode.classList.add("media");
            setTimeout(function () {
              popup.update();
            }, 10);
          } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
            var audio = document.createElement("audio");
            audio.controls = true;
            audio.src = src;
            imgTd.parentNode.replaceChild(audio, imgTd);
            popup._contentNode.classList.add("media");
            setTimeout(function () {
              popup.setContent(tempDiv.innerHTML);
              popup.update();
            }, 10);
          } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
            var video = document.createElement("video");
            video.controls = true;
            video.src = src;
            video.style.width = "400px";
            video.style.height = "300px";
            video.style.maxHeight = "60vh";
            video.style.maxWidth = "60vw";
            imgTd.parentNode.replaceChild(video, imgTd);
            popup._contentNode.classList.add("media");
            // Aggiorna il popup quando il video carica i metadati
            video.addEventListener("loadedmetadata", function () {
              popup.update();
            });
            setTimeout(function () {
              popup.setContent(tempDiv.innerHTML);
              popup.update();
            }, 10);
          } else {
            popup._contentNode.classList.remove("media");
          }
        } else {
          popup._contentNode.classList.remove("media");
        }
      }
      var zoomControl = L.control
        .zoom({
          position: "topleft",
        })
        .addTo(map);
      L.control.locate({ locateOptions: { maxZoom: 19 } }).addTo(map);
      var measureControl = new L.Control.Measure({
        position: "topleft",
        primaryLengthUnit: "meters",
        secondaryLengthUnit: "kilometers",
        primaryAreaUnit: "sqmeters",
        secondaryAreaUnit: "hectares",
      });
      measureControl.addTo(map);
      document.getElementsByClassName(
        "leaflet-control-measure-toggle"
      )[0].innerHTML = "";
      document.getElementsByClassName(
        "leaflet-control-measure-toggle"
      )[0].className += " fas fa-ruler";
      var bounds_group = new L.featureGroup([]);
      function setBounds() {}
      map.createPane("pane_GoogleMaps_0");
      map.getPane("pane_GoogleMaps_0").style.zIndex = 400;
      var layer_GoogleMaps_0 = L.tileLayer(
        "https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",
        {
          pane: "pane_GoogleMaps_0",
          opacity: 1.0,
          attribution: "",
          minZoom: 1,
          maxZoom: 28,
          minNativeZoom: 0,
          maxNativeZoom: 19,
        }
      );
      layer_GoogleMaps_0;
      map.addLayer(layer_GoogleMaps_0);
      function pop_wilayahdesacandiwulan_1(feature, layer) {
        var popupContent =
          '<table>\
                    <tr>\
                        <td colspan="2">' +
          (feature.properties["id"] !== null
            ? autolinker.link(
                String(feature.properties["id"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' +
          (feature.properties["nama"] !== null
            ? autolinker.link(
                String(feature.properties["nama"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          "</td>\
                    </tr>\
                </table>";
        var content = removeEmptyRowsFromPopupContent(popupContent, feature);
        layer.on("popupopen", function (e) {
          addClassToPopupIfMedia(content, e.popup);
        });
        layer.bindPopup(content, { maxHeight: 400 });
      }

      function style_wilayahdesacandiwulan_1_0() {
        return {
          pane: "pane_wilayahdesacandiwulan_1",
          opacity: 1,
          color: "rgba(178,223,138,1.0)",
          dashArray: "",
          lineCap: "butt",
          lineJoin: "miter",
          weight: 5.0,
          fill: true,
          fillOpacity: 1,
          fillColor: "rgba(255,255,255,0.35294117647058826)",
          interactive: true,
        };
      }
      map.createPane("pane_wilayahdesacandiwulan_1");
      map.getPane("pane_wilayahdesacandiwulan_1").style.zIndex = 401;
      map.getPane("pane_wilayahdesacandiwulan_1").style["mix-blend-mode"] =
        "normal";
      var layer_wilayahdesacandiwulan_1 = new L.geoJson(
        json_wilayahdesacandiwulan_1,
        {
          attribution: "",
          interactive: true,
          dataVar: "json_wilayahdesacandiwulan_1",
          layerName: "layer_wilayahdesacandiwulan_1",
          pane: "pane_wilayahdesacandiwulan_1",
          onEachFeature: pop_wilayahdesacandiwulan_1,
          style: style_wilayahdesacandiwulan_1_0,
        }
      );
      bounds_group.addLayer(layer_wilayahdesacandiwulan_1);
      map.addLayer(layer_wilayahdesacandiwulan_1);
      function pop_BalaiDesaCandiwulan_2(feature, layer) {
        var popupContent =
          '<table>\
                    <tr>\
                        <td colspan="2">' +
          (feature.properties["id"] !== null
            ? autolinker.link(
                String(feature.properties["id"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' +
          (feature.properties["Nama"] !== null
            ? autolinker.link(
                String(feature.properties["Nama"])
                  .replace(/'/g, "'")
                  .toLocaleString()
              )
            : "") +
          "</td>\
                    </tr>\
